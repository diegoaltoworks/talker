name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run linter
        run: bun run lint

      - name: Run type check
        run: bun run typecheck

      - name: Run security audit
        run: bun run security:check

      - name: Run tests
        run: bun test

      - name: Build package
        run: bun run build

  packaged-install:
    name: Packed tarball imports with only hono
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Optional peers (@diegoaltoworks/chatter, @libsql/client, openai) are
      # absent in the throwaway project this creates, so a top-level value
      # import of any of them fails here — the runtime counterpart to the
      # static guard in src/peer-deps.test.ts.
      - name: Smoke test the packed tarball
        run: bun run test:packaged
