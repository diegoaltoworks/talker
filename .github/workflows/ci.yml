name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Run type check
        run: bun run typecheck

      - name: Run security audit
        run: bun run security:check

      - name: Run tests
        run: bun test

      - name: Build package
        run: bun run build

  packaged-install:
    name: Packed tarball imports and resolves every exports key
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Optional peers (@diegoaltoworks/chatter, @libsql/client, openai) are
      # absent in the throwaway project this creates, so a top-level value
      # import of any of them fails here — the runtime counterpart to the
      # static guard in src/peer-deps.test.ts. The script also resolves every
      # exports key under import and require against the installed artifact,
      # which is the only place a subpath with no bundle shows up.
      - name: Smoke test the packed tarball
        run: bun run test:packaged

  chatter-latest:
    name: Suite against chatter@latest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The `test` job pins chatter to the bottom of the peer range; this one
      # pulls the top. chatter publishes a minor on every merge, so without a
      # leg that tracks latest, the coupling is only ever proven against a
      # version no host installs.
      - name: Install chatter@latest
        run: bun add -d @diegoaltoworks/chatter@latest

      - name: Report the resolved version
        run: bun pm ls | grep '@diegoaltoworks/chatter'

      - name: Run type check
        run: bun run typecheck

      - name: Run tests
        run: bun test
