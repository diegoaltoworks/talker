name: Publish to NPM

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

jobs:
  # A human is in the loop on every release, either by authoring the commit that
  # lands on main or by dispatching this workflow. Dependency bumps do not
  # qualify: dependabot opens the PR, auto-merge lands it, and CI goes green
  # without anyone reading the diff, so publishing off that commit would put an
  # upstream maintainer's code on npm under our name unattended. The bump still
  # ships — with the next human-authored merge, or when someone dispatches this
  # workflow deliberately.
  publish:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event == 'push' &&
        !startsWith(github.event.workflow_run.head_commit.message, 'chore(release): v') &&
        github.event.workflow_run.head_commit.author.name != 'dependabot[bot]' &&
        github.event.workflow_run.actor.login != 'dependabot[bot]'
      )

    permissions:
      contents: write
      id-token: write

    env:
      NODE_VERSION: 24.x
      # Optional. When set, the version bump is also pushed to main so the
      # checked-in manifest tracks what shipped; see "Push the version bump".
      RELEASE_PAT: ${{ secrets.RELEASE_PAT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The job condition only sees the commit that triggered this run, so a
      # dependency bump merged earlier would ride out inside the next person's
      # release with nobody having read it. This scans everything not yet
      # released and stops the automated path on anything dependabot changed
      # beyond a manifest or lockfile — a workflow or Dockerfile bump changes
      # what runs, and that wants a human. Manifest-only bumps ride along, which
      # is what keeps the guard from wedging the release train against itself:
      # only a successful publish moves the tag the scan starts from. See
      # scripts/release-guard.ts.
      - name: Refuse to auto-release unreviewed dependency changes
        if: github.event_name != 'workflow_dispatch'
        run: |
          git fetch --tags --force
          bun scripts/release-guard.ts

      # The same gates as CI, through the same entry point, so the publish path
      # cannot quietly run a smaller set than a PR does.
      - name: Run gates
        run: bun run check

      - name: Build package
        run: bun run build

      # CI runs this as its own job, but a dispatched release does not pass
      # through CI at all — and dispatch is exactly the path used to ship a
      # reviewed dependency bump. Running it here makes every publish, however
      # triggered, verify the artifact it is about to push.
      - name: Verify the packed tarball resolves every exports key
        run: bun run test:packaged

      # The bump type is derived from every commit since the last release tag
      # (not just the triggering one), so a chore/fix/docs merge ships a patch
      # and only a feat merge ships a minor. See scripts/next-version.ts.
      - name: Bump version
        id: bump
        run: |
          set -o pipefail
          git fetch --tags --force
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          if [ -n "$LATEST_TAG" ]; then
            BASE_VERSION="${LATEST_TAG#v}"
          else
            BASE_VERSION=$(node -p "require('./package.json').version")
          fi
          RANGE="${LATEST_TAG:+${LATEST_TAG}..}HEAD"
          BUMP=$(git log "$RANGE" --format='%s' | bun scripts/next-version.ts bump)
          NEW_VERSION=$(bun scripts/next-version.ts apply "$BASE_VERSION" "$BUMP")
          while git rev-parse --verify --quiet "refs/tags/v${NEW_VERSION}" >/dev/null; do
            NEW_VERSION=$(bun scripts/next-version.ts apply "$NEW_VERSION" "$BUMP")
          done
          npm version "$NEW_VERSION" --no-git-tag-version >/dev/null
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      # The tag, not main, is what this workflow has to write: main is covered
      # by the "main-protection" ruleset and the default token is not an admin,
      # so a push to the branch is refused once the ruleset requires a reviewed
      # PR. The ruleset targets branches only, so the tag push below goes
      # through — and the tag names a commit that carries the bumped manifest,
      # so `git checkout v<x.y.z>` still reads the version it published.
      - name: Commit and tag the version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"

      # Optional convenience, not part of the release: with an operator token
      # configured (a PAT belonging to a repo admin, who bypasses the ruleset)
      # main's package.json tracks the published version too. Without one the
      # release is already complete — the tag is the record — so this is skipped
      # rather than failed, and the checked-in version reads as a floor.
      - name: Push the version bump to main
        run: |
          if [ -z "$RELEASE_PAT" ]; then
            echo "RELEASE_PAT not configured — main keeps its current version; v${{ steps.bump.outputs.version }} is recorded by the tag."
            exit 0
          fi
          git push "https://x-access-token:${RELEASE_PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      - name: Update npm (OIDC trusted publishing needs a recent client)
        run: npm install -g npm@latest

      - name: Publish to NPM (OIDC trusted publishing - no token)
        run: npm publish --provenance --access public

      # The release notes are cut here rather than by a workflow listening for
      # the tag push above: a tag pushed with the default GITHUB_TOKEN does not
      # trigger workflows, so that listener never ran once across the whole tag
      # history while the docs pointed readers at it.
      - name: Publish the GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
